<!doctype html><meta charset="utf-8"><title>UI interaction check</title><output id="result">waiting</output><iframe id="app" src="/" width="1280" height="720"></iframe><script>
const frame=document.querySelector('#app');frame.addEventListener('load',()=>setTimeout(()=>{const doc=frame.contentDocument;const shop=doc.querySelector('[data-kind=bed]');shop.focus();doc.querySelector('[data-event=like]').click();const shopStable=shop.isConnected&&doc.activeElement===shop;doc.querySelector('#inspect-furniture').click();const panel=doc.querySelector('#item-details');const detailOpen=!panel.hidden&&doc.querySelector('#detail-name').textContent==='软软小床'&&doc.activeElement.id==='close-detail';panel.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));const escapeWorks=panel.hidden&&doc.activeElement.id==='inspect-furniture';document.querySelector('#result').textContent=JSON.stringify({shopStable,detailOpen,escapeWorks})},500));
</script>
