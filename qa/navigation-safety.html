<!doctype html>
<meta charset="utf-8">
<title>Navigation safety verification</title>
<output id="result">waiting</output>
<script type="module">
import data from '/src/scene.json';
import { setActiveRooms, setDecorBlocks, preservesConnectivity, validPlacement, path, blocked, segmentClear } from '/src/navigation.ts';
import { decorLayout } from '/src/decor-layout.ts';
import { planDelivery } from '/src/delivery.ts';

const roomIds = ['room-1', 'room-2', 'room-3'];
setActiveRooms(roomIds);
setDecorBlocks(decorLayout(roomIds).blocks);
const base = data.furniture;
const barrier = Array.from({ length: 15 }, (_, i) => ({ id: `wall-${i}`, type: 'plant', roomId: 'room-2', x: 8, z: -3.5 + i * 0.5, rotation: 0, purchased: true }));
const blocking = { id: 'block', type: 'plant', roomId: 'room-1', x: 1, z: 2, rotation: 0, purchased: true };
const door = { id: 'door', type: 'chair', roomId: 'room-1', x: 3.5, z: 0, rotation: 0, purchased: true };
const plan = planDelivery('plant', data.rooms.filter((room) => roomIds.includes(room.id)), base, 0, 2);
const route = path(0, 2, 16, 0, base);
const points = [[0, 2], ...route];
const routeSegmentsClear = route.length > 0 && points.slice(1).every((point, index) => segmentClear(points[index][0], points[index][1], point[0], point[1], base));
const crossesDoorAt = (edge) => points.slice(1).some((b, index) => {
  const a = points[index];
  if ((a[0] - edge) * (b[0] - edge) > 0 || Math.abs(b[0] - a[0]) < 1e-8) return false;
  const t = (edge - a[0]) / (b[0] - a[0]);
  const z = a[1] + (b[1] - a[1]) * t;
  return t >= 0 && t <= 1 && Math.abs(z) <= 2 / 2 - 0.52 - 0.06 + 1e-6;
});
const result = {
  threeRoomRoute: route.length > 0 && Math.abs(route.at(-1)[0] - 16) < 1e-6 && Math.abs(route.at(-1)[1]) < 1e-6 && routeSegmentsClear && crossesDoorAt(4) && crossesDoorAt(12),
  routeSegmentsClear,
  crossesBothDoors: crossesDoorAt(4) && crossesDoorAt(12),
  normal: preservesConnectivity([1, 2], [0, 3], base),
  blockedStart: !preservesConnectivity([1, 2], [0, 3], [...base, blocking]),
  disconnectedRoom: !preservesConnectivity([1, 2], [0, 3], [...base, ...barrier]),
  doorRejected: !validPlacement(door, base),
  plannedSafely: !!plan && preservesConnectivity(plan.toTarget.at(-1), plan.pickup, [...base, plan.item]),
  normalDoorOpen: !blocked(4, 0.35, []),
  doorJambRejected: blocked(4, 0.85, []),
};
document.querySelector('#result').textContent = JSON.stringify(result);
</script>
